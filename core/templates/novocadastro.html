{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Cadastro</title>
    <link rel="stylesheet" href="{% static 'assets/css/style.bundle.css' %}">
    <style>
        body {
            background: #f3f6f9;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
            padding: 32px;
        }
        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 24px;
        }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #212529; }
        input {
            width: 100%; box-sizing: border-box; border: 1px solid #e5e7eb; border-radius: 10px;
            padding: 14px 16px; font-size: 15px; background: #f9fafb;
        }
        .checkbox { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .checkbox input { width: auto; }
        .btn {
            width: 100%; border: 0; border-radius: 10px; padding: 14px 16px; font-size: 16px;
            cursor: pointer; font-weight: 700; background: #1e1e2d; color: white;
        }
        .btn:hover { opacity: .95; }
        .link {
            display: block; text-align: center; margin-top: 18px; color: #0d6efd; text-decoration: none;
        }
        .alert { background: #fff1f2; color: #b91c1c; padding: 10px 12px; border-radius: 8px; margin-bottom: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">Criar conta</div>
        <div class="subtitle">Cadastre-se para continuar</div>

        {% if form.errors %}
            <div class="alert">
                {% for field in form %}
                    {% for error in field.errors %}
                        {{ error }}<br>
                    {% endfor %}
                {% endfor %}
                {% for error in form.non_field_errors %}
                    {{ error }}
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" action="{% url 'register' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Nome de usuário</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password1">Senha</label>
                <input type="password" id="password1" name="password1" required>
            </div>

            <div class="form-group">
                <label for="password2">Confirmar senha</label>
                <input type="password" id="password2" name="password2" required>
            </div>

            <div class="checkbox">
                <input type="checkbox" id="agree" name="agree">
                <label for="agree" style="margin:0;">Aceito os termos</label>
            </div>

            <button type="submit" class="btn">Enviar</button>
            <a class="link" href="{% url 'login' %}">Voltar para login</a>
        </form>
    </div>
</body>
</html>
