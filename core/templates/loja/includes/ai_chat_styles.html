<style>
         .ai-chat-launcher,
         .ai-chat-close,
         .ai-chat-back,
         .ai-chat-send {
            border: 0;
            cursor: pointer;
         }

         .ai-chat-launcher {
            position: fixed;
            right: 22px;
            bottom: 20px;
            z-index: 9998;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--theme-color);
            color: #fff;
            box-shadow: 0 14px 34px rgba(0, 0, 0, .24);
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
         }

         .ai-chat-window {
            position: fixed;
            right: 20px;
            bottom: 92px;
            z-index: 9999;
            width: 385px;
            max-width: calc(100vw - 24px);
            height: 520px;
            max-height: calc(100vh - 112px);
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .28);
            overflow: hidden;
            display: none;
            flex-direction: column;
            font-family: Poppins, sans-serif;
         }

         .ai-chat-window.is-open {
            display: flex;
         }

         .ai-chat-header {
            flex-shrink: 0;
            min-height: 80px;
            padding: 18px 18px 16px 14px;
            background: var(--theme-color);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
         }

         .ai-chat-back,
         .ai-chat-close {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(0, 0, 0, .12);
            color: #fff;
            font-size: 19px;
         }

         .ai-chat-close {
            margin-left: auto;
            background: transparent;
         }

         .ai-chat-avatar {
            width: 39px;
            height: 39px;
            border-radius: 50%;
            background: #f3f6f9;
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
         }

         .ai-chat-title strong,
         .ai-chat-title span {
            display: block;
         }

         .ai-chat-title strong {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.3;
         }

         .ai-chat-title span {
            color: rgba(255, 255, 255, .82);
            font-size: 12px;
         }

         .ai-chat-title span:before {
            content: '';
            width: 8px;
            height: 8px;
            display: inline-block;
            border-radius: 50%;
            background: #28d468;
            margin-right: 7px;
         }

         .ai-chat-body {
            flex: 1 1 auto;
            min-height: 0;
            padding: 18px 14px;
            background: #fff;
            overflow-y: auto;
         }

         .ai-chat-day {
            width: fit-content;
            margin: 0 auto 18px;
            padding: 6px 10px;
            border-radius: 6px;
            background: #f5f7fa;
            color: #6b7280;
            font-size: 12px;
         }

         .ai-chat-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
         }

         .ai-chat-row.user {
            justify-content: flex-end;
         }

         .ai-chat-mini-avatar {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #e6e6e6;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            flex: 0 0 auto;
         }

         .ai-chat-bubble {
            max-width: 78%;
            padding: 12px 13px;
            border-radius: 8px;
            background: #f1f1f1;
            color: #5d6570;
            font-size: 13px;
            line-height: 1.55;
            white-space: pre-line;
         }

         .ai-chat-row.user .ai-chat-bubble {
            background: var(--theme-color);
            color: #fff;
         }

         .ai-chat-time {
            color: #8a94a3;
            font-size: 11px;
            margin: -6px 0 12px 40px;
         }

         .ai-chat-form {
            flex: 0 0 auto;
            margin: 0 14px 16px;
            min-height: 56px;
            border: 1px solid #dce1e7;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px 8px 16px;
            width: calc(100% - 28px);
            box-sizing: border-box;
            flex-wrap: nowrap;
            min-width: 0;
            overflow: hidden;
         }

         .ai-chat-input,
         input.ai-chat-input,
         #aiChatInput {
            border: 0;
            outline: 0;
            flex: 1 1 140px;
            min-width: 140px;
            width: 100% !important;
            max-width: 100%;
            min-height: 52px;
            height: 52px;
            font-size: 13px;
            line-height: 1.4;
            color: #111827 !important;
            background: #ffffff !important;
            text-shadow: none;
            -webkit-text-fill-color: #111827 !important;
            -webkit-appearance: none;
            appearance: none;
            caret-color: var(--theme-color);
            padding: 12px 12px 12px 0;
            box-sizing: border-box;
            display: block;
            flex-shrink: 1;
            resize: none;
            overflow-y: auto;
         }

         .ai-chat-input:-webkit-autofill,
         .ai-chat-input:-webkit-autofill:hover,
         .ai-chat-input:-webkit-autofill:focus {
            -webkit-text-fill-color: #111827 !important;
            -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
            transition: background-color 5000s ease-in-out 0s;
         }

         .ai-chat-send {
            background: transparent;
            color: var(--theme-color);
            font-size: 22px;
            padding: 0;
            width: 36px;
            height: 36px;
            min-width: 36px;
            flex: 0 0 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            flex-shrink: 0;
         }

         @media (max-width: 767px) {
            .ai-chat-window {
               right: 10px;
               left: 10px;
               bottom: 86px;
               width: calc(100vw - 20px) !important;
               max-width: calc(100vw - 20px) !important;
               height: min(72vh, 520px);
               height: min(72dvh, 520px);
               max-height: calc(100dvh - 98px);
            }

            .ai-chat-form {
               margin: 0 10px 12px;
               width: calc(100% - 20px) !important;
               min-height: 64px;
               display: grid;
               grid-template-columns: minmax(0, 1fr) 48px;
               gap: 8px;
               padding: 8px 10px 8px 12px;
               align-items: stretch;
               overflow: hidden;
            }

            .ai-chat-input,
            input.ai-chat-input,
            #aiChatInput {
               font-size: 16px;
               min-width: 0 !important;
               width: 100% !important;
               max-width: 100%;
               min-height: 64px;
               height: 64px;
               padding: 10px 10px 10px 0;
               line-height: 1.3;
               grid-column: 1;
               color: #111827 !important;
               background: #fff !important;
               -webkit-text-fill-color: #111827 !important;
            }

            .ai-chat-send {
               width: 48px;
               height: 48px;
               min-width: 48px;
               flex-basis: 48px;
               font-size: 20px;
               align-self: center;
            }

            .ai-chat-launcher {
               right: 16px;
               bottom: 16px;
            }
         }
</style>
