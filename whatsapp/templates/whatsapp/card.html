<style>
   .whatsapp-api-card {
      background: #25d366;
      transition: box-shadow 0.2s, transform 0.2s, background-color 0.2s;
   }
   .whatsapp-api-card:hover {
      background: #1fbd59;
      box-shadow: 0 0 0 0.2rem rgba(37, 211, 102, 0.2), 0 4px 20px rgba(37, 211, 102, 0.25);
      transform: translateY(-2px) scale(1.03);
   }
</style>
<div class="col-12 col-md-6 col-xl-4">
   <a href="{% url 'painel_whatsapp' %}" class="card card-custom card-stretch gutter-b whatsapp-api-card" style="text-decoration: none;">
      <span class="card-body" style="padding: 1.25rem 1.25rem 1rem 1.25rem;">
         <span class="svg-icon svg-icon-white svg-icon-3x ml-n1" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
               <path d="M12 2C6.49 2 2 6.04 2 11C2 13.23 2.91 15.27 4.42 16.84L3 22L8.53 20.55C9.61 20.85 10.78 21 12 21C17.51 21 22 16.96 22 12C22 7.04 17.51 2 12 2Z" fill="white" opacity="0.35"/>
               <path d="M16.75 13.96C16.49 13.83 15.21 13.21 14.97 13.12C14.73 13.04 14.56 13 14.38 13.25C14.21 13.51 13.71 14.09 13.55 14.26C13.4 14.43 13.25 14.45 12.99 14.32C11.47 13.56 10.47 12.96 9.47 11.24C9.2 10.78 9.74 10.81 10.23 9.81C10.32 9.64 10.27 9.49 10.21 9.36C10.15 9.23 9.63 7.95 9.42 7.44C9.21 6.94 9 7.01 8.84 7C8.69 6.99 8.52 6.99 8.35 6.99C8.18 6.99 7.9 7.06 7.67 7.32C7.43 7.58 6.77 8.2 6.77 9.48C6.77 10.76 7.7 12 7.83 12.17C7.96 12.34 9.66 14.97 12.27 16.09C13.92 16.8 14.57 16.86 15.4 16.74C15.9 16.67 16.94 16.11 17.15 15.5C17.37 14.89 17.37 14.37 17.3 14.26C17.24 14.15 17.01 14.09 16.75 13.96Z" fill="white"/>
            </svg>
         </span>
         <span class="d-flex align-items-baseline justify-content-between mt-3">
            <span class="text-white font-weight-bolder font-size-h5 mb-2">WhatsApp</span>
            {% with wa=user.tenant.whatsapp_configuracao %}
            <span class="label label-light-{% if wa.status == 'conectado' %}success{% else %}danger{% endif %} label-pill font-weight-bold">{% if wa.status == 'conectado' %}🟢 Conectado{% else %}🔴 Não conectado{% endif %}</span>
            {% endwith %}
         </span>
         <span class="d-block text-white font-weight-bold font-size-sm">Conecte o WhatsApp da sua loja</span>
      </span>
   </a>
</div>
